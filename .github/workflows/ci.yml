name: ci

on: [push, pull_request]

env:
  # Smoke scene: hard enough that no planner is expected to solve it in 2 s, so the
  # loop below asserts "runs without crashing" rather than competitiveness.
  SMOKE_SCENE: scene4.json
  # Solve scene: BiQRRT measured 3/3 at --time-limit 10 and 3/3 at 30 (scene5 also 3/3).
  # BiQRRT only: QRRT solved no scene 3/3, its best was scene1 2/3 at 30 s, so gating on
  # it would be flaky. Tracked as an open item in Phase 2 of ROADMAP.md.
  SOLVE_SCENE: scene1.json
  # URDF scene: one 6-DOF UR5 that must swing around a radial wall. The gate is seed 42,
  # which solves 3/3 in ~0.03 s — a ~70x margin on the 2 s budget. Other seeds are not
  # gated and are not uniform: re-measured locally at --time-limit 1, seed 99 solves 3/3
  # (~0.71 s) and seed 7 solves 0/3 even at 2 s. Keep the gate on seed 42.
  URDF_SCENE: ur5_scene1.json
  URDF_SOLVE_BUDGET: "2"
  # Planar regression pin: the planar path must not move when the URDF path is touched.
  # Measured locally on mlmp:dev and reproduced after every change in this track.
  # Per-runner if GitHub's value differs; see the note on the step below.
  PLANAR_RAW_PIN: "6.1990845726570605"

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mlmp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke every planner
        run: |
          set -u
          failed=0
          for s in "$SMOKE_SCENE" "$URDF_SCENE"; do
            for a in BiQRRT QRRT QRRTStar QMP QMPStar \
                     RRT RRTConnect PRMStar BITStar AITStar EITStar LBKPIECE; do
              docker run --rm mlmp:ci --algo "$a" --input-file "$s" --time-limit 2 \
                >/dev/null 2>&1 && code=0 || code=$?
              case "$code" in
                0) echo "ok   $s $a (solved)" ;;
                1) echo "ok   $s $a (no solution in budget)" ;;
                *) echo "FAIL $s $a (exit $code)"; failed=1 ;;
              esac
            done
          done
          exit "$failed"

      - name: URDF solve check
        run: |
          set -eu
          docker run --rm mlmp:ci --algo BiQRRT --input-file "$URDF_SCENE" \
            --time-limit "$URDF_SOLVE_BUDGET" --seed 42 | python3 -c '
          import json,sys
          r=json.load(sys.stdin)
          assert r["solved"] is True and r["exact"] is True, r["status"]
          assert r["model"]=="urdf", r["model"]
          assert r["dof"]==6 and r["robots"]==1 and r["links"]==6, (r["dof"],r["robots"],r["links"])
          assert r["robot_model"]=="ur5", r["robot_model"]
          assert r["robot_urdf"].endswith("ur5.urdf"), r["robot_urdf"]
          assert r["path_states"]>1 and len(r["path"])==r["path_states"], r["path_states"]
          assert all(len(q)==6 for q in r["path"]), "path states are not 6-DOF"
          '

      - name: Planar regression pin
        run: |
          # Guards the one constraint of Track D: adding the URDF path must not move a
          # planar number. If this ever fails on a fresh runner without a planar code
          # change, record the observed value here rather than deleting the check; the
          # two-run equality check below remains the real determinism gate.
          set -eu
          raw=$(docker run --rm mlmp:ci --algo BiQRRT --input-file "$SOLVE_SCENE" \
                  --time-limit 10 --seed 42 \
                | python3 -c 'import json,sys;print(repr(json.load(sys.stdin)["path_length_raw"]))')
          test "$raw" = "$PLANAR_RAW_PIN" || { echo "planar regression: $raw != $PLANAR_RAW_PIN"; exit 1; }

      - name: Solve check
        run: |
          set -eu
          docker run --rm mlmp:ci --algo BiQRRT --input-file "$SOLVE_SCENE" --time-limit 10

      - name: JSON contract and determinism
        run: |
          set -eu
          a=$(docker run --rm mlmp:ci --algo BiQRRT --input-file "$SOLVE_SCENE" --time-limit 10 --seed 42)
          b=$(docker run --rm mlmp:ci --algo BiQRRT --input-file "$SOLVE_SCENE" --time-limit 10 --seed 42)
          echo "$a" | python3 -c '
          import json,sys
          r=json.load(sys.stdin)
          assert r["schema"]=="mlmp.run/1", r.get("schema")
          assert r["solved"] is True and r["exact"] is True, r["status"]
          assert r["seed"]==42, r["seed"]
          assert r["model"]=="planar", r["model"]
          assert r["dof"]==8 and r["robots"]==2 and r["links"]==4, (r["dof"],r["robots"],r["links"])
          assert r["robot_model"] is None and r["robot_urdf"] is None, r["robot_model"]
          assert r["path_length_raw"]>0, r["path_length_raw"]
          assert r["path_length_simplified"]>0, r["path_length_simplified"]
          assert r["state_validity_checks"]>0, "validity checks never counted"
          assert r["states_sampled"]>0, "samples never counted"
          assert r["time_first_solution_s"] is not None, "no first-solution time"
          assert r["trace"] is None, r["trace"]
          '
          # Only seed-determined fields are compared. Iteration counters deliberately are
          # not: the multilevel planners consume the whole --time-limit, so vertex, sample
          # and check counts track runner speed rather than the seed.
          for k in path_length_raw path_length_simplified; do
            x=$(echo "$a" | python3 -c "import json,sys;print(json.load(sys.stdin)['$k'])")
            y=$(echo "$b" | python3 -c "import json,sys;print(json.load(sys.stdin)['$k'])")
            test "$x" = "$y" || { echo "non-deterministic $k: $x vs $y"; exit 1; }
          done

      - name: Trace contract
        run: |
          set -u
          mkdir -p trace-out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/trace-out:/out" mlmp:ci \
            --algo BiQRRT --input-file "$SOLVE_SCENE" --time-limit 3 --seed 42 \
            --trace-file /out/trace.jsonl > trace-out/run.json && code=0 || code=$?
          # 3 s is below the measured solve budget, so exit 1 is a legal outcome here.
          case "$code" in 0|1) ;; *) echo "unexpected exit $code"; exit 1 ;; esac
          # `set -e` is off here, and this is no longer the step's last command, so a failed
          # assertion must terminate the step explicitly.
          python3 - <<'PY' || exit 1
          import json
          run = json.load(open('trace-out/run.json'))
          lines = [l for l in open('trace-out/trace.jsonl').read().splitlines() if l]
          header = json.loads(lines[0])
          assert header['schema'] == 'mlmp.trace/1', header
          dim = header['robots'] * header['links']
          frames = [json.loads(l) for l in lines[1:]]
          assert frames, 'no frames captured'
          assert run['trace']['frames'] == len(frames), (run['trace'], len(frames))
          assert run['trace']['errors'] == 0, run['trace']
          trees = set()
          for f in frames:
              for v in f['vertices']:
                  assert len(v['q']) == dim, v
                  trees.add(v['tree'])
          assert 'start' in trees and 'goal' in trees, trees
          assert 'untagged' not in trees, 'BiQRRT left vertices untagged'
          # BiQRRT tags its own trees, so captureFrame must not have derived anything. The
          # first frame is captured before any vertex exists and labels nothing, so it carries
          # no tree_source at all.
          sources = {f.get('tree_source') for f in frames if f['vertices']}
          assert sources == {'planner'}, sources
          PY
          # Same scene, seed and budget with a planner that tags nothing: captureFrame has to
          # label the graph by connectivity, or every viewer draws one grey hairball again.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/trace-out:/out" mlmp:ci \
            --algo QRRT --input-file "$SOLVE_SCENE" --time-limit 3 --seed 42 \
            --trace-file /out/qrrt.jsonl > trace-out/qrrt-run.json && code=0 || code=$?
          case "$code" in 0|1) ;; *) echo "unexpected exit $code"; exit 1 ;; esac
          python3 - <<'PY'
          import json
          lines = [l for l in open('trace-out/qrrt.jsonl').read().splitlines() if l]
          assert json.loads(lines[0])['schema'] == 'mlmp.trace/1', lines[0][:80]
          frames = [json.loads(l) for l in lines[1:]]
          assert frames, 'no QRRT frames captured'
          sources = {f.get('tree_source') for f in frames if f['vertices']}
          assert sources == {'derived'}, sources
          trees = {v['tree'] for f in frames for v in f['vertices']}
          assert 'start' in trees, trees
          PY

      - name: Bad input exits 2
        run: |
          set -u
          out=$(docker run --rm mlmp:ci --input-file does-not-exist.json) && code=0 || code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
          echo "$out" | python3 -c '
          import json,sys
          r=json.load(sys.stdin)
          assert r["schema"]=="mlmp.run/1", r.get("schema")
          assert r["error"]["kind"]=="io", r["error"]
          '

  # Parallel to build-and-smoke: the wasm module is a second target of the same sources, and a
  # break there (threads, filesystem, payload size) is invisible to the native gates.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A distinct cache scope: the wasm image shares no layer with the native one, and one
      # scope would make the two jobs evict each other.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wasm
          target: dist
          outputs: type=local,dest=web/dist
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm

      - name: Renderer copy check
        run: |
          set -eu
          cmp web/src/renderer.js docs/renderer.js

      # Group 6 of renderer.test.mjs imports mlmp/tools/traceGif.py to compare the two
      # renderers' shared constants, and that module imports matplotlib, numpy and PIL.
      # apt rather than pip: the runner's python3 is externally managed (PEP 668).
      - name: Python renderer-parity dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-matplotlib python3-pil

      - name: Renderer unit test
        run: |
          set -eu
          node web/test/renderer.test.mjs

      - name: Payload size gate
        run: |
          set -eu
          wasm=$(gzip -9 -c web/dist/src/mlmp.wasm | wc -c)
          glue=$(gzip -9 -c web/dist/src/mlmp.mjs | wc -c)
          total=$((wasm + glue))
          # Printed whether or not it passes: the roadmap wants the compressed payload measured,
          # not estimated.
          echo "gzip -9: mlmp.wasm ${wasm} B + mlmp.mjs ${glue} B = ${total} B"
          test "$total" -le 5242880 || { echo "over the 5 MiB gzip budget"; exit 1; }

      - name: Node smoke
        run: |
          set -eu
          node web/test/smoke.mjs
