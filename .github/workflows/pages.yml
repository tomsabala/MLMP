name: pages

# A repository has exactly one Pages source, and docs/ already is it (the README links
# https://tomsabala.github.io/MLMP/). Publishing web/dist alone would take the committed-trace
# player offline, so one artifact carries both: docs/ at the root, the wasm playground at /live/.
#
# One-time manual step: the repository's Pages source must be switched from
# "Deploy from a branch -> /docs" to "GitHub Actions". Until then this workflow runs green and
# the published site does not change.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a pending one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same build and cache scope as ci.yml's wasm job, so a push to main reuses its layers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wasm
          target: dist
          outputs: type=local,dest=web/dist
          cache-from: type=gha,scope=wasm
          cache-to: type=gha,mode=max,scope=wasm

      - name: Assemble the site
        run: |
          set -eu
          cp -r docs _site
          cp -r web/dist _site/live
          test -f _site/index.html
          test -f _site/live/src/mlmp.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
